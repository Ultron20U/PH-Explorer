<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%" role="img" aria-label="PH-Explorer Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#121217"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>
    <radialGradient id="amberGlow" cx="82%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#ff9000" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#ff9000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ff9000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leftGlow" cx="15%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#ff6a00" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ffb84d"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#2a2a35" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff9900" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Outer Card -->
  <rect x="2" y="2" width="1196" height="336" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="336" rx="20" fill="url(#grid)"/>
  <rect x="2" y="2" width="1196" height="336" rx="20" fill="url(#amberGlow)"/>
  <rect x="2" y="2" width="1196" height="336" rx="20" fill="url(#leftGlow)"/>

  <!-- Decorative Waveform / Heatmap Curve on Right -->
  <g opacity="0.26" transform="translate(690, 65)">
    <path d="M0,160 Q45,155 75,115 T150,95 T225,40 T300,85 T375,30 T440,120 L440,175 L0,175 Z" fill="url(#accentGrad)" opacity="0.22"/>
    <path d="M0,160 Q45,155 75,115 T150,95 T225,40 T300,85 T375,30 T440,120" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="225" cy="40" r="5" fill="#ffb84d"/>
    <circle cx="375" cy="30" r="5" fill="#ff9900"/>
  </g>

  <!-- Top Version / Architecture Kicker -->
  <g transform="translate(64, 52)">
    <rect x="0" y="0" width="388" height="28" rx="14" fill="#1a1a22" stroke="#ff9900" stroke-opacity="0.45" stroke-width="1"/>
    <circle cx="16" cy="14" r="4.5" fill="#ff9900"/>
    <text x="30" y="18.5" fill="#ffb84d" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2">WINDOWS • MACOS • LINUX • ANDROID APK</text>
  </g>

  <!-- Main Brand Lockup -->
  <g transform="translate(64, 102)">
    <!-- Play / Proxy Icon Box -->
    <rect x="0" y="4" width="66" height="66" rx="15" fill="url(#accentGrad)"/>
    <polygon points="25,21 25,53 50,37" fill="#09090b"/>

    <!-- Typography -->
    <text x="86" y="54" fill="#ffffff" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">PH</text>
    <rect x="172" y="10" width="272" height="56" rx="10" fill="#ff9900"/>
    <text x="188" y="53" fill="#09090b" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-0.8">Explorer</text>
  </g>

  <!-- Subtitle Description -->
  <text x="64" y="208" fill="#d4d4dc" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="19.5" font-weight="500">
    Ad-free, privacy-first local streaming frontend with a custom theater player,
  </text>
  <text x="64" y="236" fill="#9e9eae" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="18.5" font-weight="400">
    multi-threaded Turbo Downloader, offline library, and real-time Whisper AI subtitles.
  </text>

  <!-- Feature Pills Row -->
  <g transform="translate(64, 266)" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="600">
    <g transform="translate(0, 0)">
      <rect width="176" height="32" rx="8" fill="#17171f" stroke="#2e2e3a" stroke-width="1"/>
      <text x="88" y="20.5" fill="#f0f0f5" text-anchor="middle">0 PIP DEPENDENCIES</text>
    </g>
    <g transform="translate(188, 0)">
      <rect width="170" height="32" rx="8" fill="#17171f" stroke="#2e2e3a" stroke-width="1"/>
      <text x="85" y="20.5" fill="#f0f0f5" text-anchor="middle">HLS + 206 MP4 PROXY</text>
    </g>
    <g transform="translate(370, 0)">
      <rect width="184" height="32" rx="8" fill="#17171f" stroke="#2e2e3a" stroke-width="1"/>
      <text x="92" y="20.5" fill="#ffb84d" text-anchor="middle">LOCAL WHISPER.CPP AI</text>
    </g>
    <g transform="translate(566, 0)">
      <rect width="180" height="32" rx="8" fill="#17171f" stroke="#2e2e3a" stroke-width="1"/>
      <text x="90" y="20.5" fill="#f0f0f5" text-anchor="middle">TURBO DOWNLOADER</text>
    </g>
    <g transform="translate(758, 0)">
      <rect width="168" height="32" rx="8" fill="#17171f" stroke="#2e2e3a" stroke-width="1"/>
      <text x="84" y="20.5" fill="#f0f0f5" text-anchor="middle">STEALTH BOSS KEY</text>
    </g>
    <g transform="translate(938, 0)">
      <rect width="194" height="32" rx="8" fill="#18261c" stroke="#2ea44f" stroke-opacity="0.65" stroke-width="1"/>
      <text x="97" y="20.5" fill="#56d364" text-anchor="middle">NATIVE ANDROID APK</text>
    </g>
  </g>
</svg>
