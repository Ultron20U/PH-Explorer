name: Build Desktop ZIP & Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'server.py'
      - 'index.html'
      - 'setup_ai.py'
      - 'start_server.bat'
      - 'start.sh'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Desktop Edition ZIP (Windows / macOS / Linux)
        run: |
          mkdir -p dist_pkg/PH-Explorer
          cp index.html server.py setup_ai.py setup_ai.bat start_server.bat start.sh README.md LICENSE dist_pkg/PH-Explorer/
          mkdir -p dist_pkg/PH-Explorer/assets
          cp assets/banner.svg dist_pkg/PH-Explorer/assets/
          (cd dist_pkg && zip -r ../PH-Explorer-Desktop.zip PH-Explorer)
          ls -lh PH-Explorer-Desktop.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11 for Chaquopy
        id: py
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle server.py and index.html into Android Python assets
        run: |
          mkdir -p android/app/src/main/python
          cp server.py android/app/src/main/python/server.py
          cp index.html android/app/src/main/python/index.html

      - name: Generate release signing keystore & build signed APK
        working-directory: android
        env:
          PHE_BUILD_PYTHON: ${{ steps.py.outputs.python-path }}
          PHE_KEYSTORE_FILE: ${{ runner.temp }}/phexplorer-release.jks
          PHE_KEYSTORE_PASSWORD: phexplorer-open-source-key
          PHE_KEY_ALIAS: phexplorer
          PHE_KEY_PASSWORD: phexplorer-open-source-key
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi
          keytool -genkeypair -v \
            -keystore "$PHE_KEYSTORE_FILE" \
            -alias "$PHE_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PHE_KEYSTORE_PASSWORD" \
            -keypass "$PHE_KEY_PASSWORD" \
            -dname "CN=PH-Explorer, OU=OpenSource, O=PH-Explorer, L=Local, S=NA, C=US"
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../PH-Explorer-Android.apk
          ls -lh ../PH-Explorer-Android.apk

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PH-Explorer-Packages
          path: |
            PH-Explorer-Desktop.zip
            PH-Explorer-Android.apk

      - name: Publish v1.2.0 Release (Desktop ZIP + Android APK)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > /tmp/release_notes.md
          ### PH-Explorer v1.2.0 — Alternative Pornhub Frontend & Downloader (PC + Android)

          #### 💻 Download Desktop Edition (Windows / macOS / Linux)
          - Download **`PH-Explorer-Desktop.zip`** below, extract it, and double-click **`start_server.bat`** (Windows) or run **`./start.sh`** (macOS / Linux).
          - Includes optional 1-click **`setup_ai.bat` / `setup_ai.py`** for offline local CPU Whisper AI subtitles!

          #### 📱 Download Native Android Edition
          - Tap **`PH-Explorer-Android.apk`** below on your Android phone or tablet (Android 8.0+) to install directly — no Play Store needed!

          #### ✨ What's New in v1.2.0
          - **Fixed Multi-Reply Comment Threads**: All 2nd, 3rd, and deeper replies now stay cleanly nested inside their parent comment thread.
          - **Profile Pictures (PFPs) & Verified Checkmarks**: Displays real profile avatars and verified badges (`Verified Model`, `Content Partner`, `Verified Pornstar`) across commenters, video uploaders, video cards, and performer profile banners.
          - **Tracked Desktop Package (`PH-Explorer-Desktop.zip`)**: Dedicated 1-click PC download package alongside `PH-Explorer-Android.apk`.
          EOF
          sed -i 's/^          //' /tmp/release_notes.md

          if gh release view v1.2.0 >/dev/null 2>&1; then
            gh release upload v1.2.0 PH-Explorer-Desktop.zip PH-Explorer-Android.apk --clobber
          else
            gh release create v1.2.0 PH-Explorer-Desktop.zip PH-Explorer-Android.apk \
              --target "${{ github.sha }}" \
              --title "v1.2.0 — Alternative Pornhub Frontend (Desktop ZIP + Android APK)" \
              --notes-file /tmp/release_notes.md
          fi
